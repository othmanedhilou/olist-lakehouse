[project]
name = "olist-lakehouse"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5"]

[project.optional-dependencies]
ml = ["mlflow>=2.16", "xgboost>=2.0", "scikit-learn>=1.4", "pandas>=2"]
dev = ["pytest>=8", "ruff>=0.5", "pandas>=2", "pyarrow>=15", "mlflow>=2.16", "xgboost>=2.0", "scikit-learn>=1.4"]
databricks = ["delta-spark>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
